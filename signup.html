<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkBee | Create Account</title>

    <!-- CSS -->
    <link rel="stylesheet" href="Css%20folder/signup.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">🐝</div>

        <h1>Create Account</h1>

        <p>Join WorkBee and start your freelancing journey.</p>

        <form id="signupForm" class="auth-form">

            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>

                <span class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                <span class="toggle-confirm-password">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <div class="remember-box">
                <label>
                    <input type="checkbox" id="terms" required>
                    I agree to the <a href="#">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<!-- JavaScript -->
<script type="module" src="Js%20folder/signup.js"></script>

</body>
</html>
